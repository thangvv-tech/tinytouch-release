name: Deploy TinyTouch Pages

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build static site with latest firmware
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf public
          cp -R site public
          cp -R assets public/assets

          release_json="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/releases/latest")"
          firmware_url="$(jq -r '.assets[] | select(.name | test("^tinytouch-.*-firmware\\.zip$"; "i")) | .browser_download_url' <<<"${release_json}" | head -n 1)"
          test -n "${firmware_url}" && test "${firmware_url}" != "null"

          curl --fail --silent --show-error --location "${firmware_url}" --output firmware.zip
          unzip -j firmware.zip '*bootloader.bin' '*partition-table.bin' '*tinytouch.bin' '*ota_data_initial.bin' -d public/firmware
          rm firmware.zip
          test -s public/firmware/bootloader.bin
          test -s public/firmware/partition-table.bin
          test -s public/firmware/tinytouch.bin
          test -s public/firmware/ota_data_initial.bin

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
